apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: task02
spec:
  selector:
    matchLabels:
      app: task02
  template:
    metadata:
      labels:
        app: task02
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.0
      initContainers:
      - name: delay
        image: busybox
        command: ['sleep', '15']